<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Entrevistas 8°C 2026 · SIP Red de Colegios</title>
<style>
:root{
  --navy:#0c447c; --navy-d:#093258; --sky:#3b8fd6; --skylight:#eaf4fd;
  --ink:#1a2a3a; --gray:#5b6b7c; --line:#e2e8f1; --bg:#f4f7fb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg);padding:18px}
.app{max-width:1100px;margin:0 auto;background:var(--bg);border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 3px rgba(12,68,124,.08)}
.hero{background:linear-gradient(120deg,var(--navy-d) 0%,var(--navy) 55%,var(--sky) 130%);position:relative;overflow:hidden;padding:22px 28px}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero::after{content:'';position:absolute;bottom:-90px;right:120px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:2;flex-wrap:wrap}
.hero-brand{display:flex;align-items:center;gap:16px}
.sip-mark{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-weight:900;font-size:18px;color:#fff;letter-spacing:-.5px}
.sip-name{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.1}
.sip-name span{font-weight:400;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6);display:block;margin-top:3px}
.hero-badge{text-align:right}
.hero-badge .yrs{font-size:26px;font-weight:900;color:#fff;letter-spacing:-.5px}
.hero-badge .lbl{font-size:10px;color:rgba(255,255,255,.65);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.hero-titlebar{margin-top:18px;position:relative;z-index:2}
.hero-titlebar h1{font-size:19px;font-weight:700;color:#fff;letter-spacing:-.2px}
.hero-titlebar p{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 28px;background:#fff;border-bottom:1px solid var(--line)}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
.search-wrap input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;background:var(--bg);color:var(--ink);transition:.15s}
.search-wrap input:focus{outline:none;border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px var(--skylight)}
.fselect{padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;background:var(--bg);color:var(--ink);cursor:pointer;font-weight:500}
.fselect:focus{outline:none;border-color:var(--sky)}
.btn-report{margin-left:auto;background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;box-shadow:0 2px 8px rgba(12,68,124,.25)}
.btn-report:hover{background:var(--navy-d);transform:translateY(-1px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line)}
.stat-card{border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg);transition:.15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(12,68,124,.08)}
.stat-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.stat-ic.bl{background:var(--skylight);color:var(--navy)}
.stat-ic.gr{background:#e7f6ed;color:#1e8449}
.stat-ic.rd{background:#fdecec;color:#c0392b}
.stat-ic.yw{background:#fef3e1;color:#c9851a}
.stat-num{font-size:21px;font-weight:800;color:var(--ink);line-height:1.1}
.stat-lbl{font-size:11px;color:var(--gray);font-weight:500;margin-top:1px}
.tbl-wrap{overflow-x:auto;padding:0 28px 24px}
table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:13px;margin-top:14px}
thead th{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:0 14px 8px;text-align:left}
tbody tr{background:#fff;transition:.12s;cursor:pointer}
tbody tr:hover{box-shadow:0 4px 14px rgba(12,68,124,.09);transform:translateY(-1px)}
tbody tr td:first-child{border-radius:12px 0 0 12px;border-left:1px solid var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody tr td:last-child{border-radius:0 12px 12px 0;border-right:1px solid var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody tr td{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td{padding:10px 14px;vertical-align:middle}
.nc{display:flex;align-items:center;gap:11px}
.ph{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--skylight)}
.ph-fallback{width:38px;height:38px;border-radius:50%;background:var(--skylight);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.stuname{font-weight:600;font-size:13px;color:var(--ink)}
.dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.dg{background:#e7f6ed;color:#1e8449}
.dr{background:#fdecec;color:#c0392b}
.d0{background:var(--bg);color:#b0bbc8}
.dp{background:#fef3e1;color:#c9851a}
.abadge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.ab-yw{background:#fef3e1;color:#c9851a}
.ab-rd{background:#fdecec;color:#c0392b}
.btn-v{font-size:12px;padding:7px 14px;border:none;color:var(--navy);background:var(--skylight);border-radius:9px;cursor:pointer;white-space:nowrap;font-weight:600;transition:.15s}
.btn-v:hover{background:var(--navy);color:#fff}
.no-r{padding:50px;text-align:center;color:var(--gray);font-size:13px}
.mat-pill{font-size:11px;color:var(--gray);font-weight:600;background:var(--bg);border-radius:6px;padding:3px 8px;display:inline-block}
.mbg{display:none;position:fixed;inset:0;background:rgba(9,50,88,.55);z-index:9999;overflow-y:auto;padding:24px 16px}
.mbg.open{display:block}
.modal-center{display:flex;justify-content:center;align-items:flex-start;min-height:100%}
.modal{background:#fff;border-radius:20px;width:min(720px,100%);overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,.35);margin:auto;color:var(--ink)}
.mhdr{background:linear-gradient(120deg,var(--navy-d) 0%,var(--navy) 70%,var(--sky) 150%);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;overflow:hidden}
.mhdr-left{display:flex;align-items:center;gap:14px;min-width:0;position:relative;z-index:2}
.mhdr-ph{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2.5px solid rgba(255,255,255,.4);flex-shrink:0}
.mhdr-ph-fallback{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.18);border:2.5px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0}
.mhdr-name{font-size:16px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhdr-meta{font-size:10.5px;color:rgba(255,255,255,.65);margin-top:3px}
.mhdr-right{display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:2}
.mhdr-brand{text-align:right;padding-right:14px;border-right:1px solid rgba(255,255,255,.22)}
.mhdr-sip{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.5px}
.mhdr-170{font-size:9px;color:rgba(255,255,255,.62);font-style:italic;margin-top:2px}
.btn-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0}
.btn-close:hover{background:rgba(255,255,255,.3)}
.action-bar{background:var(--skylight);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.action-bar p{font-size:11px;color:#4a6a8a;flex:1;min-width:120px;line-height:1.5}
.btn-print{background:var(--navy);color:#fff;border:none;padding:8px 16px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer}
.btn-print:hover{background:var(--navy-d)}
.mbody{background:#fff;color:var(--ink)}
.abox{margin:14px 22px 0;border-radius:12px;padding:12px 15px;display:flex;gap:10px;align-items:flex-start}
.abox-rd{background:#fdecec}
.abox-yw{background:#fef3e1}
.abox p{font-size:12.5px;line-height:1.55}
.abox b{font-size:18px}
.apo-card{margin:14px 22px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.apo-head{background:var(--skylight);padding:9px 15px;font-size:10.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.08em}
.apo-body{padding:13px 15px}
.apo-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px}
.af label{font-size:9.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px;font-weight:700}
.af p{font-size:12.5px;font-weight:500;line-height:1.4}
.af a{color:var(--navy);text-decoration:none}
.af.full{grid-column:1/-1}
.sup-strip{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:flex;gap:22px;flex-wrap:wrap}
.sup-lbl{font-size:9.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;width:100%}
.itrk{margin:12px 22px 0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 15px}
.itrk-t{font-size:10.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.irow{display:flex;gap:8px;flex-wrap:wrap}
.itag{font-size:11.5px;padding:5px 13px;border-radius:20px;border:1.5px solid;cursor:pointer;font-weight:600;transition:all .12s}
.itag-off{background:#fff;color:var(--gray);border-color:var(--line)}
.itag-off:hover{border-color:var(--sky)}
.itag-on{background:#fdecec;color:#c0392b;border-color:#f5c2c2}
.etabs{display:flex;border-bottom:2px solid var(--line);margin:16px 22px 0;overflow-x:auto;gap:2px}
.etab{padding:9px 16px;font-size:12.5px;cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;color:var(--gray);white-space:nowrap;font-weight:600;border-radius:8px 8px 0 0;transition:.12s}
.etab.act{color:var(--navy);border-bottom-color:var(--navy);background:var(--skylight)}
.etab:hover:not(.act){color:var(--ink);background:var(--bg)}
.etab-add{padding:9px 16px;font-size:12.5px;cursor:pointer;border:none;background:transparent;color:#1e8449;white-space:nowrap;font-weight:700;border-radius:8px 8px 0 0}
.etab-add:hover{background:#e7f6ed}
.fpanel{padding:16px 22px 22px}
.sdiv{font-size:10.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:6px;margin:16px 0 12px}
.sdiv:first-child{margin-top:0}
.est-row{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.frow{display:flex;align-items:flex-start;gap:13px;margin-bottom:11px}
.flb{font-size:12.5px;color:var(--gray);min-width:155px;padding-top:9px;flex-shrink:0;text-align:right;line-height:1.4;font-weight:500}
.fin{flex:1;font-size:12.5px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
.fin:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px var(--skylight)}
textarea.fin{min-height:72px;resize:vertical;line-height:1.55}
input.fin[type=date]{max-width:175px}
.fsel{font-size:12.5px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;font-weight:500}
.btns{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.bsave{background:var(--navy);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:12.5px;cursor:pointer;font-weight:700}
.bsave:hover{background:var(--navy-d)}
.bdel{background:transparent;border:1.5px solid var(--line);color:#9fb0c2;padding:10px 14px;border-radius:10px;font-size:12.5px;cursor:pointer;font-weight:600}
.bdel:hover{border-color:#f5c2c2;color:#c0392b;background:#fdecec}
.sok{font-size:11.5px;color:#1e8449;display:none;font-weight:700}
@media print{
  body{background:#fff;padding:0}
  .app,.toolbar,.stats,.tbl-wrap,.no-r,.action-bar,.etabs,.btns,.itrk,.no-print{display:none!important}
  .mbg{position:static!important;background:#fff!important;padding:0!important;display:block!important}
  .modal-center{display:block!important}
  .modal{width:100%!important;border:none!important;border-radius:0!important;box-shadow:none!important}
  .mhdr{background:#0c447c!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .abox-rd{background:#fdecec!important;-webkit-print-color-adjust:exact!important}
  .abox-yw{background:#fef3e1!important;-webkit-print-color-adjust:exact!important}
  .apo-head{background:#eaf4fd!important;-webkit-print-color-adjust:exact!important}
  @page{margin:14mm 12mm;size:A4}
}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.flb{min-width:110px;font-size:11px;text-align:left}.frow{flex-direction:column;gap:4px}}
</style>
</head>

  document.getElementById('statsBar').innerHTML=`
    <div class="stat-card"><div class="stat-ic bl">👥</div><div><div class="stat-num">${tot}</div><div class="stat-lbl">Total alumnos</div></div></div>
    <div class="stat-card"><div class="stat-ic gr">✓</div><div><div class="stat-num">${con}</div><div class="stat-lbl">Con entrevista</div></div></div>
    <div class="stat-card"><div class="stat-ic rd">○</div><div><div class="stat-num">${sin}</div><div class="stat-lbl">Sin entrevista</div></div></div>
    <div class="stat-card"><div class="stat-ic yw">⚠</div><div><div class="stat-num">${al}</div><div class="stat-lbl">Alerta reiterada</div></div></div>`;
}
function openM(idx){aI=idx;aT=0;document.getElementById('mbg').classList.add('open');document.body.style.overflow='hidden';renderModal();}
function closeM(e){if(!e||e.target===document.getElementById('mbg')){document.getElementById('mbg').classList.remove('open');document.body.style.overflow='';}}
function addFicha(){data[aI].ff.push({e:"",f:"",an:"",pr:"",co:"",mo:"",te:"",ac:""});aT=data[aI].ff.length-1;renderModal();}
function delFicha(){if(data[aI].ff.length<=1)return;if(!confirm('¿Eliminar esta entrevista?'))return;data[aI].ff.splice(aT,1);aT=Math.max(0,aT-1);persist();renderModal();render();}
function switchTab(t){aT=t;renderModal();}
function sf(k,v){data[aI].ff[aT][k]=v;persist();renderStats();}
function toggleI(n){const a=data[aI];const idx=a.ii.indexOf(n);if(idx>=0)a.ii.splice(idx,1);else a.ii.push(n);persist();renderModal();render();}
function saved(){persist();const el=document.getElementById('sok');if(el){el.style.display='inline-flex';setTimeout(()=>el.style.display='none',2200);}render();}
function renderModal(){
  const a=data[aI];
  document.getElementById('mAvWrap').innerHTML=avatarModal(a);
  document.getElementById('mN').textContent=a.n;
  document.getElementById('mS').textContent=`N° Mat. ${a.mat} · RUN ${a.run} · ${a.com} · 8° C · 2026`;
  const ni=a.ii.length;
  let alertHtml='';
  if(ni>=2) alertHtml=`<div class="abox abox-rd"><b>⚠</b><p><strong>Apoderado no asiste en ${ni} ocasiones.</strong> Se recomienda enviar comunicación formal y registrar en libro de clases.</p></div>`;
  else if(ni===1) alertHtml=`<div class="abox abox-yw"><b>⚠</b><p><strong>Apoderado no asistió a 1 citación.</strong> Se recomienda reagendar y dejar registro.</p></div>`;
  const apoHtml=`
  <div class="apo-card">
    <div class="apo-head">Datos del apoderado</div>
    <div class="apo-body">
      <div class="apo-grid">
        <div class="af"><label>Nombre apoderado</label><p>${esc(a.apo)||'—'}</p></div>
        <div class="af"><label>RUN</label><p>${esc(a.ar)||'—'}</p></div>
        <div class="af"><label>Teléfono</label><p>${esc(a.at)||'—'}</p></div>
        <div class="af"><label>Domicilio</label><p>${esc(a.dom)}, ${esc(a.com)}</p></div>
        <div class="af full"><label>Correo electrónico</label><p>${a.am?`<a href="mailto:${esc(a.am)}">${esc(a.am)}</a>`:'—'}</p></div>
      </div>
      ${a.as?`<div class="sup-strip"><div class="sup-lbl">Apoderado suplente</div><div class="af"><label>Nombre</label><p>${esc(a.as)}</p></div><div class="af"><label>Teléfono</label><p>${esc(a.ast)||'—'}</p></div></div>`:''}
    </div>
  </div>`;
  let itrk=`<div class="itrk"><div class="itrk-t">Citaciones sin asistencia</div><div class="irow">`;
  for(let i=1;i<=Math.max(3,a.ff.length);i++){
    const on=a.ii.includes(i);
    itrk+=`<span class="itag ${on?'itag-on':'itag-off'}" onclick="toggleI(${i})">Citación ${i}ª${on?' – no asistió':''}</span>`;
  }
  itrk+=`</div></div>`;
  let tabs=`<div class="etabs">`;
  a.ff.forEach((f,i)=>{
    const dot=f.e==='R'?' <span style="color:#1e8449">●</span>':f.e==='N'?' <span style="color:#c0392b">●</span>':'';
    tabs+=`<button class="etab ${aT===i?'act':''}" onclick="switchTab(${i})">${i+1}ª entrevista${dot}</button>`;
  });
  tabs+=`<button class="etab-add" onclick="addFicha()">＋ Nueva</button></div>`;
  const f=a.ff[aT];const canDel=a.ff.length>1;
  const panel=`<div class="fpanel">
    <div class="sdiv">Estado</div>
    <div class="est-row">
      <span style="font-size:12.5px;color:var(--gray);font-weight:500">Estado:</span>
      <select class="fsel" onchange="sf('e',this.value)">
        <option value="" ${f.e===''?'selected':''}>Sin citar</option>
        <option value="R" ${f.e==='R'?'selected':''}>Realizada</option>
        <option value="N" ${f.e==='N'?'selected':''}>Apoderado no asistió</option>
        <option value="P" ${f.e==='P'?'selected':''}>Pendiente / agendada</option>
      </select>
    </div>
    <div class="frow"><label class="flb">Fecha de entrevista</label><input type="date" class="fin" value="${f.f}" onchange="sf('f',this.value)"></div>
    <div class="sdiv">Datos de la entrevista</div>
    <div class="frow"><label class="flb">Antecedentes del alumno</label><textarea class="fin" oninput="sf('an',this.value)">${esc(f.an)}</textarea></div>
    <div class="frow"><label class="flb">Medidas preventivas</label><textarea class="fin" oninput="sf('pr',this.value)">${esc(f.pr)}</textarea></div>
    <div class="frow"><label class="flb">Medidas correctivas</label><textarea class="fin" oninput="sf('co',this.value)">${esc(f.co)}</textarea></div>
    <div class="frow"><label class="flb">Motivos entrevista</label><textarea class="fin" oninput="sf('mo',this.value)">${esc(f.mo)}</textarea></div>
    <div class="frow"><label class="flb">Temas tratados</label><textarea class="fin" oninput="sf('te',this.value)">${esc(f.te)}</textarea></div>
    <div class="frow"><label class="flb">Acuerdos</label><textarea class="fin" oninput="sf('ac',this.value)">${esc(f.ac)}</textarea></div>
    <div class="btns">
      <button class="bsave" onclick="saved()">💾 Guardar</button>
      ${canDel?`<button class="bdel" onclick="delFicha()">🗑 Eliminar entrevista</button>`:''}
      <span class="sok" id="sok">✓ Guardado correctamente</span>
    </div>
  </div>`;
  const actionBar=`<div class="action-bar no-print">
    <p>Para guardar como PDF: presiona imprimir y selecciona "Guardar como PDF". Activa "Gráficos en segundo plano" para conservar los colores.</p>
    <button class="btn-print" onclick="window.print()">🖨 Imprimir / Guardar como PDF</button>
  </div>`;
  document.getElementById('mbody').innerHTML=actionBar+alertHtml+apoHtml+itrk+tabs+panel;
}
function exportar(){
  const con=data.filter(hasDone).length;
  const al=data.filter(a=>a.ii.length>=2).map(a=>a.n).join(', ')||'Ninguno';
  alert(`INFORME EJECUTIVO 8°C 2026 — SIP Red de Colegios\n\nEntrevistas realizadas: ${con} de ${data.length}\nAlertas de inasistencia reiterada: ${al}\n\nPara un informe formal en Word, solicítalo en el chat de Claude.`);
}
render();
</script>
</body>
</html>
