<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASE-IA</title>
  <style>
    :root { --blue:#1b3a66; --bright:#4fc3f7; --gray:#f1f4f9; --border:#d9e1ec; --muted:#5b6b85; }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; color:#16243a;
           display:flex; flex-direction:column; background:#fff; }
    header { background:var(--blue); color:#fff; padding:11px 14px; font-weight:700;
             display:flex; align-items:center; gap:9px; }
    header .sub { font-size:11px; font-weight:500; color:#cfe3f5; }
    .avatar { flex-shrink:0; }
    #log { flex:1; overflow-y:auto; padding:14px; background:var(--gray);
           display:flex; flex-direction:column; gap:10px; }
    .row { display:flex; align-items:flex-end; gap:7px; }
    .row.user { flex-direction:row-reverse; }
    .msg { max-width:80%; padding:9px 12px; border-radius:16px; font-size:14px;
           line-height:1.45; white-space:pre-wrap; box-shadow:0 1px 2px rgba(0,0,0,.05); }
    .user .msg { background:var(--blue); color:#fff; border-bottom-right-radius:4px; }
    .bot .msg { background:#fff; border:1px solid var(--border); border-bottom-left-radius:4px; }
    .cites { margin-top:7px; display:flex; flex-wrap:wrap; gap:5px; }
    .cite { background:var(--gray); color:var(--blue); border-radius:9999px;
            padding:2px 8px; font-size:11px; font-weight:600; }
    .typing { display:flex; gap:4px; padding:11px 13px; background:#fff;
              border:1px solid var(--border); border-radius:16px; border-bottom-left-radius:4px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#9fb0c8; animation:b 1s infinite ease-in-out; }
    .dot:nth-child(2){ animation-delay:.15s; } .dot:nth-child(3){ animation-delay:.3s; }
    @keyframes b { 0%,80%,100%{ transform:translateY(0); opacity:.5; } 40%{ transform:translateY(-4px); opacity:1; } }
    .sugs { display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px 0; background:#fff; border-top:1px solid var(--border); }
    .sug { border:1px solid var(--border); color:var(--blue); background:#fff; border-radius:9999px;
           padding:5px 11px; font-size:12px; cursor:pointer; }
    .sug:hover { background:var(--gray); }
    form { display:flex; gap:7px; padding:11px; }
    input { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:12px; font-size:14px; outline:none; }
    input:focus { border-color:var(--bright); }
    button.send { background:var(--blue); color:#fff; border:none; border-radius:12px; padding:0 15px; font-weight:700; cursor:pointer; }
    button.send:disabled { opacity:.4; cursor:default; }
  </style>
</head>
<body>
  <header>
    <svg class="avatar" width="28" height="28" viewBox="0 0 48 48" aria-label="ASE-IA">
      <rect width="48" height="48" rx="12" fill="#15315a"/>
      <line x1="24" y1="9" x2="24" y2="14" stroke="#4fc3f7" stroke-width="2"/>
      <circle cx="24" cy="8" r="2" fill="#4fc3f7"/>
      <rect x="12" y="15" width="24" height="18" rx="6" fill="#fff"/>
      <circle cx="19" cy="24" r="2.6" fill="#1b3a66"/><circle cx="29" cy="24" r="2.6" fill="#1b3a66"/>
      <path d="M19 29 q5 3 10 0" stroke="#4fc3f7" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </svg>
    <div>ASE-IA<div class="sub">Asistente Escolar</div></div>
  </header>

  <div id="log">
    <div class="row bot"><div class="msg">¡Hola! Soy ASE-IA. Pregúntame por tareas, fechas, reglamentos o documentos del colegio.</div></div>
  </div>

  <div class="sugs" id="sugs"></div>

  <form id="f" autocomplete="off">
    <input id="q" placeholder="Escribe tu pregunta…" />
    <button class="send" type="submit" aria-label="Enviar">➤</button>
  </form>

  <script>
    var API = new URLSearchParams(location.search).get("api") || "http://localhost:4000";
    var log = document.getElementById("log");
    var sugs = ["¿Qué dice el reglamento sobre atrasos?", "¿Cuándo termina el semestre?", "¿Cómo justifico una ausencia?"];
    var convo = [];  // turnos {role, content} para dar continuidad (no usar "history": colisiona con window.history)

    function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

    function add(text, who, citations) {
      var row = el("div", "row " + who);
      var msg = el("div", "msg", text);
      if (citations && citations.length) {
        var box = el("div", "cites");
        citations.forEach(function (c) { box.appendChild(el("span", "cite", "[" + c.index + "] " + c.titulo)); });
        msg.appendChild(box);
      }
      row.appendChild(msg);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function renderSugs() {
      var box = document.getElementById("sugs");
      box.innerHTML = "";
      sugs.forEach(function (s) {
        var b = el("button", "sug", s);
        b.type = "button";
        b.onclick = function () { ask(s); };
        box.appendChild(b);
      });
    }

    var typingRow = null;
    function setTyping(on) {
      if (on && !typingRow) {
        typingRow = el("div", "row bot");
        var t = el("div", "typing");
        t.appendChild(el("span", "dot")); t.appendChild(el("span", "dot")); t.appendChild(el("span", "dot"));
        typingRow.appendChild(t); log.appendChild(typingRow); log.scrollTop = log.scrollHeight;
      } else if (!on && typingRow) { typingRow.remove(); typingRow = null; }
    }

    async function ask(text) {
      text = (text || "").trim();
      if (!text) return;
      document.getElementById("sugs").innerHTML = "";
      add(text, "user");
      document.getElementById("q").value = "";
      setTyping(true);
      try {
        var r = await fetch(API + "/api/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: convo.slice(-6) }),
        });
        var data = await r.json();
        setTyping(false);
        var reply = data.reply || data.error || "Sin respuesta.";
        add(reply, "bot", data.citations);
        convo.push({ role: "user", content: text });
        convo.push({ role: "assistant", content: reply });
      } catch (err) {
        setTyping(false);
        add("No pude conectar con el asistente. Intenta más tarde.", "bot");
      }
    }

    document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); ask(document.getElementById("q").value); });
    renderSugs();
  </script>
</body>
</html>
