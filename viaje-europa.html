<body class="paper font-sans text-ink">
  <div id="root"></div>

  <!--
    El JSX se guarda como texto y se compila con Babel usando el runtime "classic"
    (React.createElement) para que funcione con React cargado como global UMD,
    sin necesidad de un bundler ni de "react/jsx-runtime".
  -->
  <script type="text/jsx-source" id="app-source">
    const { useState, useEffect, useMemo, useRef } = React;

    /* ------------------------------------------------------------------ */
    /*  Icono basado en lucide (set lucide-react renderizado en navegador) */
    /* ------------------------------------------------------------------ */
    const Icon = ({ name, size = 22, className = "", strokeWidth = 2, ...rest }) => {
      const L = window.lucide || {};
      // El icono puede estar en lucide.icons[name] o como lucide[name] según el build UMD.
      let node = (L.icons && L.icons[name]) || L[name] || null;
      if (node && node.iconNode) node = node.iconNode; // forma { iconNode: [...] }
      const children = Array.isArray(node) ? node : null;
      if (!children) {
        // Fallback discreto si el icono no existe en esta versión de lucide.
        return <span className={cls("inline-block rounded-full bg-current opacity-40", className)} style={{ width: size * 0.45, height: size * 0.45 }} />;
      }
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size} height={size} viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth={strokeWidth}
          strokeLinecap="round" strokeLinejoin="round"
          className={className} {...rest}
        >
          {children.map((c, i) => React.createElement(c[0], { key: i, ...c[1] }))}
        </svg>
      );
    };

    /* ------------------------------------------------------------------ */
    /*  Sistema de etiquetas (badges)                                      */
    /* ------------------------------------------------------------------ */
    const BADGE = {
      "Atracción":  { icon: "Landmark",    cls: "bg-indigo-100 text-indigo-700 ring-indigo-200" },
      "Transporte": { icon: "Plane",       cls: "bg-sky-100 text-sky-700 ring-sky-200" },
      "Comida":     { icon: "Utensils",    cls: "bg-amber-100 text-amber-700 ring-amber-200" },
      "Compras":    { icon: "ShoppingBag", cls: "bg-rose-100 text-rose-700 ring-rose-200" },
    };
    const Badge = ({ type, sm }) => {
      const b = BADGE[type] || BADGE["Atracción"];
      return (
        <span className={`inline-flex items-center gap-1 rounded-full ring-1 font-semibold ${b.cls} ${sm ? "px-2 py-0.5 text-[11px]" : "px-2.5 py-1 text-xs"}`}>
          <Icon name={b.icon} size={sm ? 12 : 14} strokeWidth={2.4} />
          {type}
        </span>
      );
    };

    /* Periodos del día */
    const PERIODS = {
      "Mañana":   { icon: "Sunrise", cls: "text-amber-600",  bg: "bg-amber-100",  emoji: "🌅" },
      "Mediodía": { icon: "Sun",     cls: "text-orange-600", bg: "bg-orange-100", emoji: "☀️" },
      "Tarde":    { icon: "Sunset",  cls: "text-rose-600",   bg: "bg-rose-100",   emoji: "🌇" },
      "Noche":    { icon: "Moon",    cls: "text-indigo-600", bg: "bg-indigo-100", emoji: "🌙" },
    };

    /* Tema por ciudad — basado en los COLORES DE LA BANDERA de cada país.
       grad: gradiente vibrante legible (texto blanco encima)
       stripes: las 3 franjas reales de la bandera (incluye blanco)
       soft/dot/ring/text: tokens de Tailwind para acentos */
    const CITY = {
      Barcelona: { country: "España",       flag: "🇪🇸", grad: "from-red-600 via-amber-400 to-yellow-400",  stripes: ["#AA151B", "#F1BF00", "#AA151B"], soft: "bg-red-50 text-red-700 ring-red-200",       dot: "bg-red-600",     ring: "ring-red-300",    text: "text-red-600",    chip: "bg-red-600" },
      Roma:      { country: "Italia",        flag: "🇮🇹", grad: "from-green-600 via-emerald-500 to-red-600",  stripes: ["#008C45", "#FFFFFF", "#CD212A"], soft: "bg-green-50 text-green-700 ring-green-200",  dot: "bg-green-600",   ring: "ring-green-300",  text: "text-green-700",  chip: "bg-green-600" },
      "París":   { country: "Francia",       flag: "🇫🇷", grad: "from-blue-700 via-sky-500 to-red-600",       stripes: ["#0055A4", "#FFFFFF", "#EF4135"], soft: "bg-blue-50 text-blue-700 ring-blue-200",    dot: "bg-blue-600",    ring: "ring-blue-300",   text: "text-blue-700",   chip: "bg-blue-600" },
      Londres:   { country: "Reino Unido",   flag: "🇬🇧", grad: "from-blue-900 via-indigo-700 to-red-700",    stripes: ["#012169", "#FFFFFF", "#C8102E"], soft: "bg-indigo-50 text-indigo-800 ring-indigo-200", dot: "bg-indigo-800", ring: "ring-indigo-300", text: "text-indigo-800", chip: "bg-indigo-800" },
      Chile:     { country: "Chile",         flag: "🇨🇱", grad: "from-blue-700 via-sky-500 to-red-600",       stripes: ["#0039A6", "#FFFFFF", "#D52B1E"], soft: "bg-blue-50 text-blue-700 ring-blue-200",    dot: "bg-blue-700",    ring: "ring-blue-300",   text: "text-blue-700",   chip: "bg-blue-700" },
    };

    const cls = (...a) => a.filter(Boolean).join(" ");

    /* Barra de franjas reales de la bandera (animada) */
    const FlagBar = ({ city, className = "h-1.5", vertical = false }) => {
      const s = (CITY[city] || CITY.Barcelona).stripes;
      return (
        <div className={cls("flex overflow-hidden", vertical ? "flex-col" : "flex-row", className)}>
          {s.map((c, i) => <div key={i} className="flex-1" style={{ background: c }} />)}
        </div>
      );
    };

    /* ------------------------------------------------------------------ */
    /*  IMÁGENES (cargan en el navegador; con respaldo "postal" elegante)  */
    /*  Fuente: Unsplash CDN. Si una foto no carga, se ve el degradado.    */
    /* ------------------------------------------------------------------ */
    const U = (id, w = 1100) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=72`;
    const IMG = {

      day: {

        3:  U("1552832230-c0197dd311b5"),    4:  U("1531572753322-ad063cecc140"),
        5:  U("1531425300797-d5dc8b021c84"), 6:  U("1525874684015-58379d421a52"),
        7:  U("1552832230-c0197dd311b5"),    8:  U("1502602898657-3e91760cbb34"),
        9:  U("1550340499-a6c60fc8287c"),    10: U("1513635269975-59663e0ac1ad"),
        11: U("1486299267070-83823f5448dd"), 12: U("1505761671935-60b3a7427bad"),
        13: U("1533929736458-ca588d08c8be"), 14: U("1520986606214-8b456906c813"),
        15: U("1539037116277-4db20889f2d4"), 16: U("1436491865332-7a61a109cc05"),
      },
    };

    /* ------------------------------------------------------------------ */
    /*  Lienzo "postal": degradado decorativo por ciudad (respaldo).       */
    /* ------------------------------------------------------------------ */
    const Postcard = ({ gradient = "from-slate-700 to-slate-900", icon = "Landmark", label, className = "", big = false, children }) => (
      <div className={cls("relative overflow-hidden bg-gradient-to-br", gradient, className)}>
        {/* textura de puntos */}
        <div className="absolute inset-0 opacity-20"
          style={{ backgroundImage: "radial-gradient(rgba(255,255,255,.85) 1px, transparent 1px)", backgroundSize: "16px 16px" }} />
        {/* brillo diagonal sutil */}
        <div className="absolute -inset-x-10 -top-10 h-32 rotate-12 bg-white/10 blur-2xl" />
        <div className="absolute inset-0 flex flex-col items-center justify-center text-white/90">
          <Icon name={icon} size={big ? 64 : 40} strokeWidth={1.25} />
          {label && <span className={cls("mt-2 font-display italic tracking-wide", big ? "text-3xl" : "text-lg")}>{label}</span>}
        </div>
        {children}
      </div>
    );

    /* Foto real con respaldo: si la URL falla, queda el lienzo "postal" */
    const Photo = ({ src, alt, gradient, icon, label, className = "", kenburns = false, children }) => {
      const [ok, setOk] = useState(Boolean(src));
      return (
        <div className={cls("relative overflow-hidden", className)}>
          <Postcard gradient={gradient} icon={icon} label={label} className="absolute inset-0 h-full w-full" />
          {ok && (
            <img src={src} alt={alt || label || ""} loading="lazy" onError={() => setOk(false)}
              className={cls("absolute inset-0 h-full w-full object-cover", kenburns && "animate-kenburns")} />
          )}
          {children}
        </div>
      );
    };

    /* ------------------------------------------------------------------ */
    /*  Iconos de transporte: detecta el modo mencionado en un texto       */
    /*  (metro, tren, tranvía, bus, a pie, funicular, avión…)              */
    /* ------------------------------------------------------------------ */
    const TRANSPORT_MODES = [
      { re: /\b(metro|tube|underground|subte)\b/i,                 icon: "TrainFront",       label: "Metro" },
      { re: /\b(rer)\b|eurostar|\btren\b|express|railway|renfe/i,  icon: "TrainFrontTunnel", label: "Tren" },
      { re: /\b(tranv[ií]a|tram)\b/i,                              icon: "TramFront",        label: "Tranvía" },
      { re: /aerob[uú]s|autob[uú]s|\bbus\b/i,                      icon: "Bus",        label: "Bus" },
      { re: /funicular/i,                                          icon: "CableCar",   label: "Funicular" },
      { re: /a pie|caminando|camina|min a pie/i,                   icon: "Footprints", label: "A pie" },

      { re: /barco|ferry|crucero/i,                               icon: "Ship",       label: "Barco" },

    const detectModes = (text) => TRANSPORT_MODES.filter(m => m.re.test(text || ""));

      {

        transfer: { from: "Barcelona", to: "Roma", mode: "Vuelo directo", detail: "Vueling / Ryanair / ITA · ~1h45 · BCN → FCO/CIA", icon: "Plane" },

          { n: "Park Güell", note: "Zona Monumental con reserva; mosaicos de Gaudí", how: "Metro L3 hasta Lesseps o Vallcarca + 10 min cuesta arriba, o bus 116 hasta la entrada." },
          { n: "Barrio Gótico", note: "Catedral y Plaça Reial", how: "Metro L3 dirección centro hasta Liceu (bajada directa desde Lesseps)." },
          { n: "Aeropuerto El Prat", note: "Para el vuelo a Roma", how: "Aerobús A1/A2 desde Pl. Catalunya (~35 min) o Metro L9 Sud hasta el aeropuerto." },

              </div>
              <div className="min-w-0">
                <h1 className="truncate font-display text-xl sm:text-2xl font-bold leading-none">
                  <span className="bg-gradient-to-r from-blue-700 via-rose-600 to-amber-500 bg-clip-text text-transparent">Eurotrip</span>
                  <span className="text-ink"> · 16 días</span>
                </h1>
                <p className="hidden sm:block text-[11px] font-semibold tracking-[0.1em] text-stone-500">🇪🇸 Barcelona · 🇮🇹 Roma · 🇫🇷 París · 🇬🇧 Londres</p>
              </div>

              {/* Nav desktop */}
              <nav className="ml-auto hidden md:flex items-center gap-1">
                {TABS.map(t => (
                  <button key={t.id} onClick={() => setTab2(t.id)}
                    className={cls("inline-flex items-center gap-1.5 rounded-full px-3.5 py-2 text-sm font-bold transition-all",
                      tab === t.id ? "bg-gradient-to-r from-blue-700 via-rose-600 to-amber-500 text-white shadow-md scale-105" : "text-stone-600 hover:bg-stone-100 hover:scale-105")}>
                    <Icon name={t.icon} size={16} /> {t.label}
                  </button>
                ))}
              </nav>

              {/* Botón menú móvil */}
              <button onClick={() => setMenu(m => !m)}
                className="ml-auto md:hidden inline-flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-blue-700 via-rose-600 to-amber-400 text-white shadow">
                <Icon name={menu ? "X" : "Menu"} size={24} />
              </button>
            </div>

            {/* Menú móvil */}
            {menu && (
              <nav className="md:hidden border-t border-stone-100 bg-white px-3 py-2 animate-fadeUp">
                {TABS.map(t => (
                  <button key={t.id} onClick={() => setTab2(t.id)}
                    className={cls("flex w-full items-center gap-2.5 rounded-xl px-3 py-3 text-sm font-bold transition",
                      tab === t.id ? "bg-gradient-to-r from-blue-700 via-rose-600 to-amber-500 text-white" : "text-stone-600 hover:bg-stone-100")}>
                    <Icon name={t.icon} size={18} /> {t.label}
                  </button>
                ))}
              </nav>
            )}
          </header>

          {/* HERO */}
          {showHero && <Hero onCta={() => setTab2("mapa")} />}

          {/* CONTENIDO */}
          <main className="mx-auto max-w-6xl px-4 py-8 sm:py-12">
            {render()}
          </main>

          {/* FOOTER */}
          <footer className="mt-8 bg-white">
            <div className="flex">
              {["Barcelona", "Roma", "París", "Londres"].map(c => <FlagBar key={c} city={c} className="h-1.5 flex-1" />)}
            </div>
            <div className="mx-auto max-w-6xl px-4 py-8 text-center">
              <div className="mb-3 text-3xl">🇪🇸 🇮🇹 🇫🇷 🇬🇧</div>
              <p className="flex items-center justify-center gap-2 font-display text-2xl font-semibold text-ink">
                <Icon name="Plane" size={18} className="text-blue-600 animate-wiggle" /> 16 días · 4 ciudades · Europa
              </p>
              <p className="mt-2 text-xs text-stone-400 max-w-xl mx-auto">Costos, recomendaciones y rutas de "cómo llegar" son estimaciones referenciales; verifica precios, horarios y líneas de transporte antes de viajar.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- Bootstrap: compila el JSX anterior y lo ejecuta -->
  <script>
    (function () {
      function boot() {
        try {
          var src = document.getElementById("app-source").textContent;
          var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
          (0, eval)(out); // eval indirecto => ámbito global (React, ReactDOM, lucide UMD)
        } catch (e) {
          document.getElementById("root").innerHTML =
            '<div style="max-width:640px;margin:60px auto;padding:24px;font-family:sans-serif;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:16px">' +
            '<strong>No se pudo cargar la aplicación.</strong><br/>Revisa tu conexión (se cargan React, Tailwind, Babel y lucide desde CDN).<br/><br/><code style="font-size:12px;color:#7f1d1d">' +
            (e && e.message ? e.message : e) + '</code></div>';
          console.error(e);
        }
      }
      // Asegura que React, ReactDOM, Babel y lucide ya estén disponibles.
      if (window.Babel && window.React && window.ReactDOM) boot();
      else window.addEventListener("load", boot);
    })();
  </script>
</body>
</html>
