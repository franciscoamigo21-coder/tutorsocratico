    const Icon = ({ name, size = 22, className = "", strokeWidth = 2, ...rest }) => {
      const L = window.lucide || {};
      // El icono puede estar en lucide.icons[name] o como lucide[name] según el build UMD.
      let node = (L.icons && L.icons[name]) || L[name] || null;
      if (node && node.iconNode) node = node.iconNode; // forma { iconNode: [...] }
      const children = Array.isArray(node) ? node : null;
      if (!children) {
        // Fallback discreto si el icono no existe en esta versión de lucide.
        return <span className={cls("inline-block rounded-full bg-current opacity-40", className)} style={{ width: size * 0.45, height: size * 0.45 }} />;
      }
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size} height={size} viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth={strokeWidth}
          strokeLinecap="round" strokeLinejoin="round"
          className={className} {...rest}
        >
          {children.map((c, i) => React.createElement(c[0], { key: i, ...c[1] }))}
        </svg>
      );
    };

                          <Icon name={p.icon} size={18} className={p.cls} />
                          <h5 className="text-sm font-bold uppercase tracking-wide text-slate-600">{b.period}</h5>
                        </div>
                        <div className="grid gap-2.5 sm:grid-cols-2">
                          {b.items.map((it, j) => <ActivityCard key={j} item={it} />)}
                        </div>
                      </div>
                    );
                  })}

                  {/* Recomendaciones */}
                  <div className="grid gap-3 sm:grid-cols-2 pt-1">
                    <div className="rounded-xl bg-amber-50 ring-1 ring-amber-200 p-3.5">
                      <div className="mb-2 flex items-center gap-2 font-bold text-amber-800">
                        <Icon name="Utensils" size={16} /> Dónde comer
                      </div>
                      <ul className="space-y-2">
                        {d.food.map((f, i) => (
                          <li key={i} className="text-sm">
                            <span className="font-semibold text-slate-800">{f.n}</span>
                            <span className="ml-1 rounded bg-amber-200/60 px-1.5 py-0.5 text-[11px] font-semibold text-amber-800">{f.p}</span>
                            <p className="text-slate-500 leading-snug">{f.d}</p>
                          </li>
                        ))}
                      </ul>
                    </div>
                    <div className="rounded-xl bg-rose-50 ring-1 ring-rose-200 p-3.5">
                      <div className="mb-2 flex items-center gap-2 font-bold text-rose-800">
                        <Icon name="ShoppingBag" size={16} /> Compras & souvenirs
                      </div>
                      <ul className="space-y-2">
                        {d.shopping.map((s, i) => (
                          <li key={i} className="text-sm">
                            <span className="font-semibold text-slate-800">{s.n}</span>
                            <p className="text-slate-500 leading-snug">{s.d}</p>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Mapa */}
                <div className="lg:col-span-1">
                  <MapPanel map={d.map} city={d.city} />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ---------------------------- VISTAS ------------------------------ */
    const ItineraryView = () => {
      const [open, setOpen] = useState(1);
      const [filter, setFilter] = useState("Todas");
      const cities = ["Todas", "Barcelona", "Roma", "París", "Londres"];
      const days = useMemo(
        () => filter === "Todas" ? ITINERARY : ITINERARY.filter(d => d.city === filter),
        [filter]
      );
      return (
        <div className="space-y-4">
          {/* Filtros por ciudad */}
          <div className="flex flex-wrap gap-2">
            {cities.map(c => (
              <button key={c} onClick={() => setFilter(c)}
                className={cls("inline-flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-sm font-semibold ring-1 transition",
                  filter === c ? "bg-slate-800 text-white ring-slate-800" : "bg-white text-slate-600 ring-slate-200 hover:bg-slate-100")}>
                {c !== "Todas" && CITY[c]?.flag} {c}
              </button>
            ))}
          </div>
          <div className="flex items-center justify-between text-sm text-slate-500">
            <span>{days.length} día{days.length !== 1 && "s"}</span>
            <div className="flex gap-3">
              <button onClick={() => setOpen("all")} className="font-semibold text-sky-600 hover:text-sky-700">Expandir todo</button>
              <button onClick={() => setOpen(null)} className="font-semibold text-slate-500 hover:text-slate-700">Colapsar</button>
            </div>
          </div>
          <div className="space-y-3">
            {days.map(d => (
              <DayCard key={d.day} d={d}
                open={open === "all" || open === d.day}
                onToggle={() => setOpen(open === d.day ? null : d.day)} />
            ))}
          </div>
        </div>
      );
    };

    const MapView = () => (
      <div className="space-y-5">
        <div className="rounded-2xl bg-white border border-slate-200 p-5">
          <h3 className="mb-1 flex items-center gap-2 text-lg font-bold text-slate-800">
            <Icon name="Map" size={20} className="text-sky-600" /> Ruta del viaje
          </h3>
          <p className="text-sm text-slate-500">4 ciudades · 16 días · 3 vuelos + 1 tren entre destinos.</p>
          {/* Ruta visual */}
          <div className="mt-4 flex flex-wrap items-center gap-2">
            {["Barcelona", "Roma", "París", "Londres", "Barcelona", "Chile"].map((c, i, arr) => (
              <React.Fragment key={i}>
                <span className={cls("inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-semibold ring-1", CITY[c].soft)}>
                  {CITY[c].flag} {c}
                </span>
                {i < arr.length - 1 && <Icon name={i === 2 ? "Train" : "Plane"} size={16} className="text-slate-400" />}
              </React.Fragment>
            ))}
          </div>
        </div>

        <div className="grid gap-4 md:grid-cols-2">
          {ITINERARY.map(d => (
            <div key={d.day} className="rounded-2xl border border-slate-200 bg-white overflow-hidden">
              <div className="flex items-center gap-2 px-4 py-2.5 border-b border-slate-100">
                <span className="text-sm font-bold text-slate-700">Día {d.day}</span>
                <span className={cls("inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold ring-1", CITY[d.city].soft)}>
                  {CITY[d.city].flag} {d.city}
                </span>
                <span className="ml-auto text-xs text-slate-400">{d.date}</span>
              </div>
              <div className="p-3">
                <MapPanel map={d.map} city={d.city} />
              </div>
            </div>
          ))}
        </div>
      </div>
    );

    const BudgetView = () => {
      const [cur, setCur] = useState("EUR"); // EUR | GBP
      const fx = cur === "GBP" ? GBP_PER_EUR : 1;
      const sym = cur === "GBP" ? "£" : "€";
      const fmt = n => sym + Math.round(n * fx).toLocaleString("es-ES");

      const cityTotals = BUDGET.cities.map(c => {
        const perDay = c.lodging / 2 + c.food + c.transport + c.attractions;
        return { ...c, perDay, total: perDay * c.nights };
      });
      const transfersTotal = BUDGET.flights.reduce((a, f) => a + f.eur, 0);
      const stayTotal = cityTotals.reduce((a, c) => a + c.total, 0);
      const grand = transfersTotal + stayTotal;

      return (
        <div className="space-y-5">
          <div className="flex items-center justify-between">
            <h3 className="flex items-center gap-2 text-lg font-bold text-slate-800">
              <Icon name="Wallet" size={20} className="text-emerald-600" /> Presupuesto estimado
            </h3>
            <div className="inline-flex rounded-lg bg-slate-100 p-1 text-sm font-semibold">
              {["EUR", "GBP"].map(c => (
                <button key={c} onClick={() => setCur(c)}
                  className={cls("rounded-md px-3 py-1 transition", cur === c ? "bg-white shadow text-slate-800" : "text-slate-500")}>
                  {c === "EUR" ? "€ EUR" : "£ GBP"}
                </button>
              ))}
            </div>
          </div>

          {/* Resumen */}
          <div className="grid gap-3 sm:grid-cols-3">
            {[
              { l: "Transporte entre ciudades", v: transfersTotal, i: "Plane", c: "text-sky-600 bg-sky-50" },
              { l: "Estancia (16 días)", v: stayTotal, i: "Hotel", c: "text-violet-600 bg-violet-50" },
              { l: "Total aproximado / persona", v: grand, i: "Wallet", c: "text-emerald-600 bg-emerald-50" },
            ].map((k, i) => (
              <div key={i} className="rounded-2xl border border-slate-200 bg-white p-4">
                <div className={cls("mb-2 inline-flex h-9 w-9 items-center justify-center rounded-lg", k.c)}>
                  <Icon name={k.i} size={18} />
                </div>
                <p className="text-sm text-slate-500">{k.l}</p>
                <p className="text-2xl font-extrabold text-slate-800">{fmt(k.v)}</p>
              </div>
            ))}
          </div>

          {/* Transporte */}
          <div className="rounded-2xl border border-slate-200 bg-white overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-100 font-bold text-slate-700 flex items-center gap-2">
              <Icon name="Plane" size={18} className="text-sky-600" /> Vuelos y tren
            </div>
            <div className="divide-y divide-slate-100">
              {BUDGET.flights.map((f, i) => (
                <div key={i} className="flex items-center justify-between px-4 py-2.5 text-sm">
                  <div>
                    <p className="font-semibold text-slate-800">{f.route}</p>
                    <p className="text-slate-400">{f.mode}</p>
                  </div>
                  <span className="font-bold text-slate-700">{fmt(f.eur)}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Por ciudad */}
          <div className="rounded-2xl border border-slate-200 bg-white overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-100 font-bold text-slate-700 flex items-center gap-2">
              <Icon name="Building2" size={18} className="text-violet-600" /> Gasto diario por ciudad
            </div>
            <div className="overflow-x-auto no-scrollbar">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 text-slate-500">
                  <tr className="text-left">
                    <th className="px-4 py-2 font-semibold">Ciudad</th>
                    <th className="px-3 py-2 font-semibold">Aloj.*</th>
                    <th className="px-3 py-2 font-semibold">Comida</th>
                    <th className="px-3 py-2 font-semibold">Transp.</th>
                    <th className="px-3 py-2 font-semibold">Atracc.</th>
                    <th className="px-3 py-2 font-semibold">€/día</th>
                    <th className="px-4 py-2 font-semibold text-right">Total</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {cityTotals.map((c, i) => (
                    <tr key={i} className="text-slate-700">
                      <td className="px-4 py-2.5 font-semibold whitespace-nowrap">{CITY[c.city].flag} {c.city} <span className="text-slate-400 font-normal">· {c.nights}n</span></td>
                      <td className="px-3 py-2.5">{fmt(c.lodging / 2)}</td>
                      <td className="px-3 py-2.5">{fmt(c.food)}</td>
                      <td className="px-3 py-2.5">{fmt(c.transport)}</td>
                      <td className="px-3 py-2.5">{fmt(c.attractions)}</td>
                      <td className="px-3 py-2.5 font-semibold">{fmt(c.perDay)}</td>
                      <td className="px-4 py-2.5 text-right font-bold">{fmt(c.total)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="px-4 py-2 text-[11px] text-slate-400">*Alojamiento por persona (habitación doble / 2).</p>
          </div>

          <div className="rounded-2xl bg-emerald-50 ring-1 ring-emerald-200 p-4">
            <div className="mb-2 flex items-center gap-2 font-bold text-emerald-800">
              <Icon name="Info" size={16} /> Notas de presupuesto
            </div>
            <ul className="space-y-1.5 text-sm text-emerald-900/80">
              {BUDGET.notes.map((n, i) => (
                <li key={i} className="flex gap-2"><span className="text-emerald-500">•</span>{n}</li>
              ))}
            </ul>
          </div>
        </div>
      );
    };

    const TipsView = () => (
      <div className="space-y-6">
        <div>
          <h3 className="mb-3 flex items-center gap-2 text-lg font-bold text-slate-800">
            <Icon name="Lightbulb" size={20} className="text-amber-500" /> Recomendaciones inteligentes
          </h3>
          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            {SMART_TIPS.map((t, i) => (
              <div key={i} className="rounded-2xl border border-slate-200 bg-white p-4">
                <div className="mb-2 inline-flex h-9 w-9 items-center justify-center rounded-lg bg-amber-50 text-amber-600">
                  <Icon name={t.icon} size={18} />
                </div>
                <p className="font-bold text-slate-800">{t.t}</p>
                <p className="text-sm text-slate-500 leading-snug">{t.d}</p>
              </div>
            ))}
          </div>
        </div>

        <div className="grid gap-4 lg:grid-cols-2">
          {TIPS.map((c, i) => (
            <div key={i} className="rounded-2xl border border-slate-200 bg-white overflow-hidden">
              <div className={cls("bg-gradient-to-r px-4 py-3 text-white font-bold text-lg", c.color)}>{c.country}</div>
              <div className="grid gap-4 p-4 sm:grid-cols-2">
                <div>
                  <div className="mb-2 flex items-center gap-2 text-sm font-bold text-amber-700">
                    <Icon name="Utensils" size={15} /> Gastronomía
                  </div>
                  <ul className="space-y-1.5 text-sm text-slate-600">
                    {c.food.map((f, j) => <li key={j} className="flex gap-2"><span className="text-amber-400">›</span>{f}</li>)}
                  </ul>
                </div>
                <div>
                  <div className="mb-2 flex items-center gap-2 text-sm font-bold text-rose-700">
                    <Icon name="ShoppingBag" size={15} /> Souvenirs
                  </div>
                  <ul className="space-y-1.5 text-sm text-slate-600">
                    {c.souvenirs.map((s, j) => <li key={j} className="flex gap-2"><span className="text-rose-400">›</span>{s}</li>)}
                  </ul>
                </div>
              </div>
              <p className="px-4 pb-3 text-xs text-slate-400 flex items-center gap-1.5">
                <Icon name="MapPin" size={13} /> {c.where}
              </p>
            </div>
          ))}
        </div>
      </div>
    );

    const ChecklistView = () => {
      const STORAGE = "eurotrip-checklist-v1";
      const [done, setDone] = useState(() => {
        try { return JSON.parse(localStorage.getItem(STORAGE)) || {}; } catch { return {}; }
      });
      useEffect(() => {
        try { localStorage.setItem(STORAGE, JSON.stringify(done)); } catch {}
      }, [done]);

      const all = Object.values(CHECKLIST).flat();
      const total = all.length;
      const completed = all.filter(i => done[i]).length;
      const pct = Math.round((completed / total) * 100);

      return (
        <div className="space-y-5">
          <div className="rounded-2xl border border-slate-200 bg-white p-5">
            <div className="flex items-center justify-between mb-3">
              <h3 className="flex items-center gap-2 text-lg font-bold text-slate-800">
                <Icon name="ListChecks" size={20} className="text-emerald-600" /> Checklist de viaje
              </h3>
              <span className="text-sm font-bold text-slate-600">{completed}/{total}</span>
            </div>
            <div className="h-3 w-full overflow-hidden rounded-full bg-slate-100">
              <div className="h-full rounded-full bg-gradient-to-r from-emerald-400 to-emerald-600 transition-all" style={{ width: pct + "%" }} />
            </div>
            <p className="mt-2 text-sm text-slate-500">{pct}% listo para viajar {pct === 100 ? "🎉" : ""}</p>
            {completed > 0 && (
              <button onClick={() => setDone({})} className="mt-2 text-xs font-semibold text-rose-500 hover:text-rose-600">Reiniciar checklist</button>
            )}
          </div>

          <div className="grid gap-4 md:grid-cols-2">
            {Object.entries(CHECKLIST).map(([cat, items]) => (
              <div key={cat} className="rounded-2xl border border-slate-200 bg-white overflow-hidden">
                <div className="px-4 py-3 border-b border-slate-100 font-bold text-slate-700">{cat}</div>
                <ul className="divide-y divide-slate-100">
                  {items.map((it, i) => (
                    <li key={i}>
                      <button onClick={() => setDone(d => ({ ...d, [it]: !d[it] }))}
                        className="flex w-full items-center gap-3 px-4 py-2.5 text-left text-sm transition hover:bg-slate-50">
                        <Icon name={done[it] ? "CheckSquare" : "Square"} size={20}
                          className={done[it] ? "text-emerald-500" : "text-slate-300"} />
                        <span className={cls(done[it] ? "text-slate-400 line-through" : "text-slate-700")}>{it}</span>
                      </button>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </div>
      );
    };

    /* ------------------------------------------------------------------ */
    /*  APP                                                                */
    /* ------------------------------------------------------------------ */
    const TABS = [
      { id: "itinerario", label: "Itinerario", icon: "CalendarDays" },
      { id: "mapa", label: "Mapas", icon: "Map" },
      { id: "presupuesto", label: "Presupuesto", icon: "Wallet" },
      { id: "tips", label: "Recomendaciones", icon: "Lightbulb" },
      { id: "checklist", label: "Checklist", icon: "ListChecks" },
    ];

    function App() {
      const [tab, setTab] = useState("itinerario");
      const [menu, setMenu] = useState(false);

      const render = () => {
        switch (tab) {
          case "mapa": return <MapView />;
          case "presupuesto": return <BudgetView />;
          case "tips": return <TipsView />;
          case "checklist": return <ChecklistView />;
          default: return <ItineraryView />;
        }
      };

      return (
        <div className="min-h-screen">
          {/* HEADER */}
          <header className="sticky top-0 z-40 border-b border-slate-200 bg-white/85 backdrop-blur">
            <div className="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3">
              <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 text-white shadow">
                <Icon name="Plane" size={20} />
              </div>
              <div className="min-w-0">
                <h1 className="truncate text-base sm:text-lg font-extrabold text-slate-800 leading-tight">Eurotrip · 16 Días</h1>
                <p className="hidden sm:block text-xs text-slate-500">Barcelona · Roma · París · Londres · 18 Ene – 2 Feb</p>
              </div>

              {/* Nav desktop */}
              <nav className="ml-auto hidden md:flex items-center gap-1">
                {TABS.map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={cls("inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-semibold transition",
                      tab === t.id ? "bg-slate-800 text-white" : "text-slate-600 hover:bg-slate-100")}>
                    <Icon name={t.icon} size={16} /> {t.label}
                  </button>
                ))}
              </nav>

              {/* Botón menú móvil */}
              <button onClick={() => setMenu(m => !m)}
                className="ml-auto md:hidden inline-flex h-10 w-10 items-center justify-center rounded-lg text-slate-700 hover:bg-slate-100">
                <Icon name={menu ? "X" : "Menu"} size={24} />
              </button>
            </div>

            {/* Menú móvil */}
            {menu && (
              <nav className="md:hidden border-t border-slate-100 bg-white px-3 py-2 animate-fadeUp">
                {TABS.map(t => (
                  <button key={t.id} onClick={() => { setTab(t.id); setMenu(false); }}
                    className={cls("flex w-full items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm font-semibold transition",
                      tab === t.id ? "bg-slate-800 text-white" : "text-slate-600 hover:bg-slate-100")}>
                    <Icon name={t.icon} size={18} /> {t.label}
                  </button>
                ))}
              </nav>
            )}
          </header>

          {/* HERO */}
          {tab === "itinerario" && (
            <section className="bg-gradient-to-br from-slate-900 via-indigo-900 to-sky-900 text-white">
              <div className="mx-auto max-w-6xl px-4 py-8 sm:py-10">
                <p className="text-sm font-semibold uppercase tracking-widest text-sky-300">Invierno en Europa</p>
                <h2 className="mt-1 text-3xl sm:text-4xl font-extrabold leading-tight">Tu aventura de 16 días</h2>
                <p className="mt-2 max-w-2xl text-slate-300">4 capitales, 3 vuelos y un viaje en Eurostar. Itinerario detallado mañana, mediodía, tarde y noche — con mapas, costos y dónde comer y comprar.</p>
                <div className="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4">
                  {[
                    { i: "CalendarDays", l: "16 días", s: "18 Ene – 2 Feb" },
                    { i: "MapPin", l: "4 ciudades", s: "BCN · ROM · PAR · LON" },
                    { i: "Plane", l: "3 vuelos + 1 tren", s: "Eurostar incluido" },
                    { i: "Wallet", l: "Presupuesto", s: "Estimado por persona" },
                  ].map((k, i) => (
                    <div key={i} className="rounded-2xl bg-white/10 p-3.5 ring-1 ring-white/15 backdrop-blur">
                      <Icon name={k.i} size={20} className="text-sky-300" />
                      <p className="mt-1.5 font-bold">{k.l}</p>
                      <p className="text-xs text-slate-300">{k.s}</p>
                    </div>
                  ))}
                </div>
              </div>
            </section>
          )}

          {/* CONTENIDO */}
          <main className="mx-auto max-w-6xl px-4 py-6 sm:py-8">
            {render()}
          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-200 bg-white">
            <div className="mx-auto max-w-6xl px-4 py-6 text-center text-sm text-slate-400">
              <p className="flex items-center justify-center gap-1.5">
                <Icon name="Plane" size={15} /> Eurotrip Planner · Hecho para disfrutar el viaje
              </p>
              <p className="mt-1 text-xs">Costos y recomendaciones son estimaciones referenciales; verifica precios y horarios antes de viajar.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- Bootstrap: compila el JSX anterior y lo ejecuta -->
  <script>
    (function () {
      function boot() {
        try {
          var src = document.getElementById("app-source").textContent;
          var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
          (0, eval)(out); // eval indirecto => ámbito global (React, ReactDOM, lucide UMD)
        } catch (e) {
          document.getElementById("root").innerHTML =
            '<div style="max-width:640px;margin:60px auto;padding:24px;font-family:sans-serif;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:16px">' +
            '<strong>No se pudo cargar la aplicación.</strong><br/>Revisa tu conexión (se cargan React, Tailwind, Babel y lucide desde CDN).<br/><br/><code style="font-size:12px;color:#7f1d1d">' +
            (e && e.message ? e.message : e) + '</code></div>';
          console.error(e);
        }
      }
      // Asegura que React, ReactDOM, Babel y lucide ya estén disponibles.
      if (window.Babel && window.React && window.ReactDOM) boot();
      else window.addEventListener("load", boot);
    })();
  </script>
</body>
</html>
