name: Deploy a GitHub Pages

# Publica la herramienta (index.html) en GitHub Pages automáticamente.
# Con enablement: true se intenta ACTIVAR Pages sin tener que tocar ajustes.

on:
  push:
    branches:
      - claude/awesome-ride-3y1cxw
      - claude/ase-ia-school-assistant-yn4c88
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages (y activarlo)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
