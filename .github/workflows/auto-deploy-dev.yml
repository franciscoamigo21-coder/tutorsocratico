name: Auto-publicar ASE-IA

# Publica automáticamente en GitHub Pages (aseia.cl) cada vez que se guarda
# un cambio de ase-ia.html en la rama de desarrollo. Construye index.html a
# partir de ase-ia.html y lo despliega directo a Pages (sin pasos manuales).

on:
  push:
    branches:
      - claude/ase-ia-school-assistant-yn4c88
    paths:
      - ase-ia.html
      - .github/workflows/auto-deploy-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir index.html desde ase-ia.html
        run: cp ase-ia.html index.html

      - name: Configurar Pages (y activarlo)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
