name: Auto-publicar ASE-IA

# Publica automáticamente en GitHub Pages (aseia.cl) cada vez que se guarda un
# cambio de ase-ia.html en la rama de desarrollo. Sincroniza ase-ia.html hacia
# index.html en la rama de publicación; el builder nativo de GitHub Pages
# (configurado para desplegar desde esa rama) republica el sitio solo.

on:
  push:
    branches:
      - claude/ase-ia-school-assistant-yn4c88
    paths:
      - ase-ia.html
      - .github/workflows/auto-deploy-dev.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-publicar-aseia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama de publicación
        uses: actions/checkout@v4
        with:
          ref: claude/awesome-ride-3y1cxw
          fetch-depth: 0

      - name: Construir index.html desde la ase-ia.html de desarrollo
        run: |
          set -e
          git fetch origin claude/ase-ia-school-assistant-yn4c88
          git checkout origin/claude/ase-ia-school-assistant-yn4c88 -- ase-ia.html
          cp ase-ia.html index.html

      - name: Commit y push a la rama de publicación (si hay cambios)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ase-ia.html
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Auto-publicar: sync ase-ia.html -> index.html (${GITHUB_SHA::7})"
          git push origin HEAD:claude/awesome-ride-3y1cxw
